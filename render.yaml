# Blueprint Render : une seule application sert l'API et le site.
#
# Deux services séparés (API d'un côté, front de l'autre) placeraient le cookie
# d'authentification en cross-site : en SameSite=strict le navigateur ne
# l'enverrait jamais et personne ne pourrait se connecter.
#
# La base PostgreSQL n'est pas optionnelle : le disque du plan gratuit est
# éphémère, donc avec SQLite tout le contenu disparaît à chaque redéploiement.

databases:
  - name: portfolio-db
    plan: free
    databaseName: portfolio
    user: portfolio

services:
  - type: web
    name: portfolio
    runtime: docker
    dockerfilePath: Back-end/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Compte de départ, créé au premier démarrage. 12 caractères minimum.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Adresse publique du service, ex. https://portfolio.onrender.com.
      # Sert aux liens de vérification et de réinitialisation envoyés par e-mail.
      - key: PUBLIC_BASE_URL
        sync: false
      # Front et API partagent l'origine : CORS n'a plus rien à autoriser.
      - key: CORS_ORIGINS
        value: ""
      # Analyse des CV. Sans clé, l'import répond 503 et le reste fonctionne.
      - key: GEMINI_API_KEY
        sync: false
      # Notification des messages de contact (facultatif).
      - key: CONTACT_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
