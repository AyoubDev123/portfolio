[project]
name = "portfolio-api"
version = "1.0.0"
description = "API du portfolio d'Ayoub El Abbassi"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # Depends() dans les signatures : idiome FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
