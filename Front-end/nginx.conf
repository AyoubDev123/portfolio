# Zones de rate-limiting (allouées au niveau http, donc déclarées ici pour docker/compose)
# Elles sont injectées via la directive map dans le bloc http de nginx.conf principal.
# Dans Docker, ce fichier est inclus depuis /etc/nginx/conf.d/ qui est déjà sous http {}.

limit_req_zone $binary_remote_addr zone=contact_limit:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

  # Snapshot statique régénéré par le back-end après chaque mutation admin.
  # Nginx le sert directement depuis le volume partagé (sans toucher au back-end).
  location = /snapshot.json {
    alias /data/snapshot.json;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    try_files $uri =404;
  }

  # Limite le formulaire de contact : 1 envoi/min, burst de 3 sans délai.
  location = /api/contact {
    limit_req zone=contact_limit burst=3 nodelay;
    limit_req_status 429;

    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Limite les tentatives de connexion admin : 5 req/min, burst de 5.
  location = /api/auth/login {
    limit_req zone=login_limit burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Assets versionnés par Vite : cache longue durée.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Routage côté client (React Router).
  location / {
    try_files $uri /index.html;
  }
}
